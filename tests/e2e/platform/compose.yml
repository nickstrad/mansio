services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mansio
      POSTGRES_PASSWORD: mansio
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mansio -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 512m
