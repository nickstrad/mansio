# Single Postgres 17 for the placement authority's integration tests (internal/placement/pg).
#   docker compose -f deploy/postgres/docker-compose.yml up -d
#   export MANSIO_PG_URL='postgres://mansio:mansio-dev@localhost:5433/mansio?sslmode=disable'
# Throwaway dev credentials; tests create and drop their own schema per test.
services:
  postgres:
    image: postgres:17
    container_name: mansio-postgres
    environment:
      POSTGRES_USER: mansio
      POSTGRES_PASSWORD: mansio-dev
      POSTGRES_DB: mansio
    # max_connections covers the PG-04 concurrency gate (64 workers) plus parallel test packages.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mansio -d mansio"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - mansio-pg-data:/var/lib/postgresql/data
volumes:
  mansio-pg-data:
