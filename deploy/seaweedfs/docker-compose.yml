# Single-container SeaweedFS (master + volume + filer + S3 gateway) for the coldload test.
#   docker compose -f deploy/seaweedfs/docker-compose.yml up -d
# S3 endpoint: http://localhost:8333  access key: coldload  secret: coldload-secret
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: coldload-seaweedfs
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=40
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
      - "8888:8888"   # filer UI
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed-data:/data
volumes:
  seaweed-data:
